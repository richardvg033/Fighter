<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Burger Rush 3D — 50 Levels</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8dd9ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;gap:8px;justify-content:space-between;align-items:start;padding:12px;color:#fff;pointer-events:none}.pill{background:#101c35c9;border:1px solid #ffffff45;border-radius:18px;padding:9px 13px;font-weight:850;text-shadow:0 1px 3px #0006;box-shadow:0 5px 18px #0002}.meter{height:7px;background:#ffffff55;border-radius:10px;overflow:hidden;margin-top:6px;width:100px}.fill{height:100%;width:0;background:#ffd54f;border-radius:10px}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none}.ctrl{pointer-events:auto;border:2px solid #ffffff99;background:#142a50bb;color:#fff;font-size:30px;font-weight:900;border-radius:22px;width:75px;height:75px;box-shadow:0 6px 18px #0003;touch-action:none}.overlay{position:fixed;inset:0;background:#0b1635a9;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}.panel{max-width:420px;width:100%;border:2px solid #ffffff80;border-radius:28px;padding:26px 22px;background:linear-gradient(150deg,#fff8e8,#fff);text-align:center;box-shadow:0 20px 60px #0006;color:#25304d}.panel h1{font-size:36px;line-height:1.05;margin:8px 0 12px}.panel p{font-size:16px;line-height:1.5}.primary{background:linear-gradient(120deg,#ff9c21,#f64c35);color:white;border:0;border-radius:18px;padding:16px 25px;font-size:19px;font-weight:900;width:100%;box-shadow:0 6px 0 #bd3c25}.secondary{margin-top:10px;background:none;border:0;color:#53617d;text-decoration:underline;font-weight:700;padding:10px}.small{font-size:13px!important;color:#68748a}.hidden{display:none!important}</style></head>
<body><canvas id="game"></canvas><div class="hud"><div class="pill">🍔 <span id="score">0</span><div style="font-size:11px">BURGERS</div></div><div class="pill" style="text-align:center">🌎 LEVEL <span id="level">1</span>/50<div class="meter"><div class="fill" id="progress"></div></div></div><div class="pill">❤️ <span id="hearts">3</span><div style="font-size:11px">LEVENS</div></div></div><div class="controls"><button class="ctrl" id="left" aria-label="Links">◀</button><button class="ctrl" id="right" aria-label="Rechts">▶</button></div><div class="overlay" id="overlay"><div class="panel"><div style="font-size:55px">🍔👨‍🍳</div><h1 id="title">BURGER RUSH 3D</h1><p id="message">Ren door kleurrijke 3D-achtige werelden, verzamel burgers en ontwijk obstakels. Versla alle 50 levels!</p><button class="primary" id="play">▶ SPELEN</button><button class="secondary" id="reset">Voortgang wissen</button><p class="small">Veeg links/rechts of gebruik de pijlen. Werkt ook met toetsenbord.</p></div></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const el=id=>document.getElementById(id);
let W=0,H=0,dpr=1,t=0,last=0,state='menu',level=1,score=0,hearts=3,distance=0,items=[],particles=[],lane=1,targetLane=1,playerX=0,spawnTimer=0,invuln=0,shake=0,finishAt=700,theme=0;
const palettes=[['#81d8ff','#e2f9ff','#77c65c','#59a443'],['#ffb67a','#ffe5b2','#dbb06d','#c48951'],['#b5a0ff','#e7ddff','#79a9b5','#547f92'],['#9fe7d2','#ecffdf','#70bf7a','#44985b'],['#ff91ba','#ffe2e9','#ab9fe1','#776fc0']];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function save(){try{localStorage.setItem('burgerRush3D',JSON.stringify({level,score}))}catch(e){}}
try{let s=JSON.parse(localStorage.getItem('burgerRush3D')||'null');if(s){level=clamp(s.level||1,1,50);score=s.score||0}}catch(e){}
function setOverlay(title,msg,button){el('title').textContent=title;el('message').textContent=msg;el('play').textContent=button;el('overlay').classList.remove('hidden')}
function start(){state='playing';hearts=3;distance=0;items=[];particles=[];lane=1;targetLane=1;playerX=0;spawnTimer=.3;invuln=0;finishAt=600+level*20;theme=Math.floor((level-1)/10)%5;el('overlay').classList.add('hidden');updateHud()}
function updateHud(){el('score').textContent=score;el('level').textContent=level;el('hearts').textContent=hearts;el('progress').style.width=(clamp(distance/finishAt,0,1)*100)+'%'}
el('play').onclick=()=>{if(state==='won'){level=1;score=0}start()};
el('reset').onclick=()=>{level=1;score=0;save();setOverlay('OPNIEUW BEGINNEN','Je voortgang is gewist. Klaar voor 50 levels?','▶ SPELEN')};
function move(dir){if(state==='playing')targetLane=clamp(targetLane+dir,0,2)}
for(const [id,dir] of [['left',-1],['right',1]]){const b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();move(dir)})}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '&&state!=='playing')el('play').click()});
let sx=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>25)move(dx>0?1:-1)},{passive:true});
const horizon=()=>H*.36,ground=()=>H*.84;
function perspective(z){let q=1-clamp(z,0,1);return q*q}
function roadWidth(z){return W*(.12+.78*perspective(z))}
function roadY(z){return horizon()+(ground()-horizon())*perspective(z)}
function roadX(l,z){return W/2+(l-1)*roadWidth(z)/3}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill()}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function scenery(){const p=palettes[theme],sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,p[0]);sky.addColorStop(.65,p[1]);sky.addColorStop(1,p[2]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(W*.8,H*.16,34,34,'#fff1a2');for(let i=0;i<7;i++){let x=((i*171-distance*.15)%(W+180)+(W+180))%(W+180)-90,y=H*(.1+(i%3)*.055);ellipse(x,y,37,13,'#ffffffb3');ellipse(x+20,y-9,26,16,'#ffffffb3')}polygon([[0,horizon()],[W*.15,horizon()-50],[W*.35,horizon()+10],[W*.56,horizon()-60],[W*.83,horizon()+5],[W,horizon()-40],[W,H],[0,H]],p[3]);ctx.fillStyle=p[2];ctx.fillRect(0,horizon()+20,W,H);for(let i=0;i<16;i++){let z=((i/16+distance*.0007)%1),y=roadY(z),rw=roadWidth(z);let side=i%2?-1:1,x=W/2+side*(rw*.58+25+60*perspective(z));let s=8+38*perspective(z);if(theme===1){rounded(x-s*.25,y-s*1.5,s*.5,s*1.5,3,'#a66c44');ellipse(x,y-s*1.6,s*.7,s*.6,'#5d9b58')}else{rounded(x-s*.12,y-s*1.3,s*.24,s*1.3,2,'#76523a');for(let k=0;k<3;k++)ellipse(x,y-s*(1.3+k*.27),s*(.7-k*.1),s*.42,k%2?'#228e58':'#2baa61')}}}
function road(){const hy=horizon(),gy=H+30,far=roadWidth(1),near=W*1.6;polygon([[W/2-far/2,hy],[W/2+far/2,hy],[W/2+near/2,gy],[W/2-near/2,gy]],'#626b7c');for(let i=0;i<2;i++){let f=W/2+(i-.5)*far/3,n=W/2+(i-.5)*near/3;for(let j=0;j<13;j++){let z=((j/13+distance*.004)%1),z2=Math.min(z+.038,1);let y=roadY(z),y2=roadY(z2);let x=f+(n-f)*perspective(z),x2=f+(n-f)*perspective(z2);polygon([[x-2,y],[x+2,y],[x2+3,y2],[x2-3,y2]],'#f6e9a6')}}for(let side of [-1,1]){polygon([[W/2+side*far*.5,hy],[W/2+side*(far*.5+3),hy],[W/2+side*(near*.5+18),gy],[W/2+side*near*.5,gy]],'#f7f2e9')}}
function burger(x,y,s){ellipse(x,y+s*.33,s*.42,s*.12,'#0003');rounded(x-s*.38,y-s*.05,s*.76,s*.19,s*.07,'#f4aa3d');rounded(x-s*.4,y-s*.22,s*.8,s*.17,s*.07,'#5d3022');rounded(x-s*.39,y-s*.3,s*.78,s*.12,s*.05,'#58c644');ellipse(x,y-s*.36,s*.42,s*.26,'#e8a047');for(let i=-2;i<=2;i++)ellipse(x+i*s*.13,y-s*(.47+Math.cos(i)*.045),s*.025,s*.015,'#fff3b9')}
function barrier(x,y,s,type){ellipse(x,y+s*.17,s*.5,s*.13,'#0005');if(type==='cone'){polygon([[x,y-s*.9],[x-s*.42,y],[x+s*.42,y]],'#f36a34');rounded(x-s*.33,y-s*.18,s*.66,s*.12,2,'#fff');rounded(x-s*.5,y-s*.04,s,s*.15,3,'#db4a30')}else{rounded(x-s*.48,y-s*.75,s*.96,s*.8,5,'#c95143');rounded(x-s*.38,y-s*.65,s*.76,s*.19,2,'#fff0be');rounded(x-s*.38,y-s*.3,s*.76,s*.15,2,'#fff0be')}}
function chef(x,y,s,step){ellipse(x,y+5,s*.5,s*.13,'#0005');const swing=Math.sin(step*10)*s*.13;ctx.lineCap='round';ctx.strokeStyle='#253654';ctx.lineWidth=s*.17;ctx.beginPath();ctx.moveTo(x-s*.14,y-s*.37);ctx.lineTo(x-s*.17+swing,y+s*.05);ctx.moveTo(x+s*.14,y-s*.37);ctx.lineTo(x+s*.17-swing,y+s*.05);ctx.stroke();ellipse(x-s*.17+swing,y+s*.06,s*.13,s*.07,'#202943');ellipse(x+s*.17-swing,y+s*.06,s*.13,s*.07,'#202943');rounded(x-s*.29,y-s*1.02,s*.58,s*.66,s*.15,'#fff7e8');ctx.strokeStyle='#f0c9a5';ctx.lineWidth=s*.16;ctx.beginPath();ctx.moveTo(x-s*.27,y-s*.88);ctx.lineTo(x-s*.43,y-s*.58-swing);ctx.moveTo(x+s*.27,y-s*.88);ctx.lineTo(x+s*.43,y-s*.58+swing);ctx.stroke();ellipse(x-s*.43,y-s*.58-swing,s*.09,s*.09,'#f3b789');ellipse(x+s*.43,y-s*.58+swing,s*.09,s*.09,'#f3b789');ellipse(x,y-s*1.25,s*.28,s*.29,'#f3bb8e');ellipse(x-s*.09,y-s*1.26,s*.027,s*.04,'#242938');ellipse(x+s*.09,y-s*1.26,s*.027,s*.04,'#242938');ctx.strokeStyle='#8b4a38';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-s*1.17,s*.09,.1,Math.PI-.1);ctx.stroke();rounded(x-s*.29,y-s*1.67,s*.58,s*.24,s*.07,'#fff');for(let i=-1;i<=1;i++)ellipse(x+i*s*.18,y-s*1.69,s*.19,s*.19,'#fff');rounded(x-s*.26,y-s*1.52,s*.52,s*.1,s*.02,'#e9e9f2');rounded(x-s*.06,y-s*.92,s*.12,s*.37,3,'#ed6449')}
function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:rnd(-120,120),vy:rnd(-180,0),life:.7,color})}
function spawn(){const l=Math.floor(rnd(0,3));let type=Math.random()<.67?'burger':(Math.random()<.5?'cone':'crate');items.push({lane:l,z:1,type,hit:false});if(Math.random()<.3&&type!=='burger')items.push({lane:(l+1+Math.floor(rnd(0,2)))%3,z:1.2,type:'burger',hit:false})}
function winLevel(){state='between';level++;save();if(level>50){state='won';setOverlay('🏆 50 LEVELS GEHAALD!','LEGEND! Je hebt alle werelden uitgespeeld met '+score+' burgers.','🔁 OPNIEUW SPELEN')}else setOverlay('⭐ LEVEL VOLTOOID!','Fantastisch! Je hebt level '+(level-1)+' gehaald. Klaar voor level '+level+'?','▶ VOLGEND LEVEL')}
function update(dt){t+=dt;shake=Math.max(0,shake-dt*4);if(state!=='playing')return;distance+=dt*(95+level*2);invuln=Math.max(0,invuln-dt);playerX+=(targetLane-1-playerX)*Math.min(1,dt*13);spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=rnd(.55,.95)*Math.max(.53,1-level*.006)}for(const o of items){o.z-=dt*(.40+level*.004);if(!o.hit&&o.z<.13&&o.z>-.08&&Math.abs(o.lane-1-playerX)<.42){o.hit=true;if(o.type==='burger'){score+=10;burst(W/2+playerX*W*.26,H*.75,'#ffcb3d')}else if(invuln<=0){hearts--;invuln=1.3;shake=1;burst(W/2+playerX*W*.26,H*.75,'#ff5544');if(hearts<=0){state='lost';save();setOverlay('💥 OEPS!','Je hebt '+score+' punten. Probeer level '+level+' opnieuw!','🔁 OPNIEUW PROBEREN')}}}}items=items.filter(o=>o.z>-.2&&!o.hit);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(distance>=finishAt&&state==='playing')winLevel();updateHud()}
function draw(){ctx.save();if(shake)ctx.translate(rnd(-5,5)*shake,rnd(-4,4)*shake);scenery();road();items.sort((a,b)=>b.z-a.z);for(const o of items){if(o.z>1||o.z<0)continue;let z=o.z,y=roadY(z),x=roadX(o.lane,z),s=12+85*perspective(z);if(o.type==='burger')burger(x,y-s*.6,s*.8);else barrier(x,y,s,o.type)}const bob=Math.sin(t*12)*3;chef(W/2+playerX*W*.26,H*.84+bob,Math.min(110,W*.24),t);for(const p of particles){ctx.globalAlpha=clamp(p.life/.7,0,1);ellipse(p.x,p.y,5,5,p.color)}ctx.globalAlpha=1;ctx.restore();if(state==='playing'&&invuln>0){ctx.fillStyle=`rgba(255,255,255,${.12+.09*Math.sin(t*24)})`;ctx.fillRect(0,0,W,H)}}
function loop(now){let dt=Math.min((now-last)/1000||.016,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
el('level').textContent=level;el('score').textContent=score;
</script></body></html>
